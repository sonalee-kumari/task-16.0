<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Records</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      padding: 30px;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    .search-box:focus {
      border-color: #4a90e2;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      border-left: 4px solid #4a90e2;
    }

    .card h3 {
      margin-top: 0;
      color: #222;
      font-size: 1.2rem;
    }

    .card p {
      margin: 8px 0;
      color: #555;
      font-size: 0.95rem;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      color: #777;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Student Directory</h1>
    <input 
      type="text" 
      id="searchInput" 
      class="search-box" 
      placeholder="Search students by name..."
    />

    <div id="studentContainer" class="card-grid"></div>
  </div>

  <script src="script.js"></script>
  </body>
</html>
